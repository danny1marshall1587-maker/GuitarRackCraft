name: Build & Release Cyber GuitarRackCraft APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cyber_pack/**'
      - 'cmake/targets/cyber_audio.cmake'
      - '.github/workflows/cyber-release.yml'
      - 'vsthost_lib/build.gradle.kts'
      - 'app/**'

permissions:
  contents: write

concurrency:
  group: cyber-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool bison flex gettext gperf \
            pkg-config cmake ninja-build meson patchelf patch python3 python3-pip \
            python3-mako python3-yaml git xz-utils ca-certificates curl ccache \
            ocaml ocamlbuild ocaml-findlib libnum-ocaml-dev faust libboost-dev \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev libxi-dev \
            libxfixes-dev libxcursor-dev libxxf86vm-dev libfreetype-dev \
            fonts-liberation fonts-dejavu
          python3 -m pip install --break-system-packages mako pyyaml meson ninja || true

      - name: Init Native 3rd_party Submodules (Recursive)
        run: |
          git submodule update --init --recursive 3rd_party

      - name: Locate Android NDK
        run: |
          if [ -d "$ANDROID_SDK_ROOT/ndk/27.2.12479018" ]; then
            echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
          else
            LATEST_NDK=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | sort -V | tail -1)
            echo "ANDROID_NDK=$LATEST_NDK" >> $GITHUB_ENV
          fi

      - name: Build Native LV2 Plugins & Cyber Audio Suite
        run: |
          echo "Using NDK: $ANDROID_NDK"
          BUILD_VST=0 ./build.sh full

      - name: Dump ExternalProject logs on failure
        if: failure()
        run: |
          echo "=== Dumping configure/build failure logs ==="
          for f in $(find build -name "*-*.log" 2>/dev/null); do
            echo "================ $f ================"
            cat "$f"
          done

      - name: Generate Self-Signed Keystore
        run: |
          keytool -genkey -v \
            -keystore "$RUNNER_TEMP/cyber.keystore" \
            -alias cyberaudio \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass cyberaudio \
            -keypass cyberaudio \
            -dname "CN=Cyber Audio, OU=Guitar, O=Cyber, L=London, ST=UK, C=GB"

      - name: Build Signed Full Release APK
        run: |
          ./gradlew assembleFullRelease \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/cyber.keystore" \
            -PRELEASE_STORE_PASSWORD=cyberaudio \
            -PRELEASE_KEY_ALIAS=cyberaudio \
            -PRELEASE_KEY_PASSWORD=cyberaudio

      - name: Locate & Stage APK
        id: stage-apk
        run: |
          APK=$(find app/build/outputs/apk/full/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK found!"
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/CyberRackCraft-Pixel8Pro.apk
          ls -lh dist/CyberRackCraft-Pixel8Pro.apk
          echo "apk_path=dist/CyberRackCraft-Pixel8Pro.apk" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberRackCraft-Pixel8Pro-APK
          path: dist/CyberRackCraft-Pixel8Pro.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0-cyber
          name: "Cyber GuitarRackCraft v1.2.0 (Evans Bass, Boutique Delays/Reverbs & Double-Tap MIDI Learn)"
          draft: false
          prerelease: false
          body: |
            ## 🎸 Cyber GuitarRackCraft v1.2.0 — Evans Bass, Studio FX Suite & Double-Tap MIDI Learn

            ### 🚀 What's New in v1.2.0:
            - **🎸 Evans Bass (`cyber-bass9.lv2`) Dedicated to Tony Evans**:
              - Complete 9-pedal virtual bass player engine dedicated to our hero **Tony Evans**.
              - Features **Diatonic Strictness** (`logic_strict`), **Chord-Tone Root Lock** (`chord_hold`), and **Walk/Groove Pattern Engine** (`walk_groove`).
              - Responsive drive-style touch GUI with interactive chicken-head dials and status indicators.
            - **🎛️ Double-Tap Slider MIDI Learn & Multi-Assignment**:
              - **Double-tap any parameter slider** on the Rack page to open the MOD-style MIDI Learn dialog.
              - **Live Expression/Footswitch Detection**: move an expression pedal or stomp a footswitch to instantly bind the CC.
              - **Reverse / Inverted Range Control**: swap Min and Max numbers or tap **Invert** to reverse parameter sweep (e.g. Min 100%, Max 0% for reverse expression).
              - **Multi-Assignment**: map the same MIDI CC (e.g. CC 11) to multiple parameters across plugins simultaneously (e.g. Reverb Mix + Delay Feedback + Delay Mix on one expression pedal).
            - **🌌 4 Boutique Delays & 3 Algorithmic Reverbs**:
              - **Delays**: `grains-of-sand` (Granular), `dusk-tape-echo` (Vintage Tape Echo), `invada-delay-munge` (Tube Delay Munge), `infamous-stuck` (Spectral Freeze).
              - **Reverbs**: `duskverb` (Ambient Shimmer), `dfjpverb` (Plate/Room algorithmic reverb), `lv2-psx-reverb` (PlayStation 1 SPX reverb).
              - All equipped with native MOD-UI touchscreen designs and interactive controls.
            - **⚡ Pixel 8 Pro / Tensor G3 Audio Anti-Throttling Hardening**:
              - Native C++ audio thread priority forced to `-19` (`PRIO_PROCESS`) on startup.
              - Battery optimization exemption declared in manifest.
              - Full sustained performance mode and ADPF hint session active.

            ### ✨ Complete Cyber Audio Rig (52+ Modules):
            - **20 Valve Amps**: Friedman BE-100, Fender Deluxe/Bassman/Vibrolux/Vibroverb, Marshall JTM45, Vox AC30TB/PA, Orange OR120, Dumble ODS, Trainwreck Express, Koch The Greg, Two-Rock CRS, Hiwatt DR504, Matchless DC30, Roland JC-120, Rockman X100, Tone King Imperial, Magnatone 280, Traynor YCV40.
            - **Galaxy Strobe Tuner**: High-precision 200% square strobe tuner pedal with HeadRush AGC auto-gain staging and live stage signal mute.
            - **Full Stomp Collection**: Evans Bass, PureSustain Delay, Smart Fizz Killer, Cyber Denoiser, Harmonic Tremolo, Cyber Screamer, Klon, Blues Driver, Guv'nor, DS-1, Noble Drive, Spring Reverb, Cloud Bloom, Acoustic Feedbacker, Hum Killer, Piezo Thump Killer, plus all 7 new Delays & Reverbs.

            ### 📲 How to Install on your Google Pixel 8 Pro:
            1. Download `CyberRackCraft-Pixel8Pro.apk` directly on your phone.
            2. Open the downloaded file and tap **Install**.
            3. Connect your USB-C OTG hub, plug in your guitar audio interface and MIDI foot controller.
            4. Launch CyberRackCraft and rock out!
          files: |
            dist/CyberRackCraft-Pixel8Pro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
