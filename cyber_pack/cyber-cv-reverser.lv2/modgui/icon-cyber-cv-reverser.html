<div class="mod-pedal mod-pedal-boxy cv-reverser-pedal">
    <div mod-role="drag-handle" class="mod-drag-handle"></div>
    <div class="mod-pedal-brand">CYBER AUDIO</div>
    <div class="mod-pedal-name">CV REVERSER</div>
    <div class="reverser-badge">0-10V INVERTER</div>
    
    <div class="mod-pedal-input">
        {{#effect.ports.cv.input}}
        <div class="mod-input mod-input-disconnected" title="{{name}}" mod-role="input-cv-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-input-image"></div>
        </div>
        {{/effect.ports.cv.input}}
    </div>
    
    <div class="mod-control-group-row">
        <div class="mod-control-group">
            <div class="mod-knob" title="Minimum Output Percentage (Floor)">
                <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="min_val"></div>
            </div>
            <div class="mod-knob-title">MIN %</div>
        </div>
        
        <div class="mod-control-group">
            <div class="mod-knob" title="Maximum Output Percentage (Ceiling)">
                <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="max_val"></div>
            </div>
            <div class="mod-knob-title">MAX %</div>
        </div>
    </div>
    
    <div class="reverser-diagram">
        <span class="diag-in">IN</span>
        <span class="diag-arr">➔ [ ⮂ ] ➔</span>
        <span class="diag-out">REV</span>
    </div>
    
    <div class="mod-pedal-output">
        {{#effect.ports.cv.output}}
        <div class="mod-output mod-output-disconnected" title="{{name}}" mod-role="output-cv-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-output-image"></div>
        </div>
        {{/effect.ports.cv.output}}
    </div>
</div>
