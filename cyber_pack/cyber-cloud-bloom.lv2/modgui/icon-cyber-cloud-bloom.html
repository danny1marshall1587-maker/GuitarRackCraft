<div class="mod-pedal mod-pedal-boxy mod-cyber-cloud-bloom">
    <div mod-role="drag-handle" class="mod-drag-handle"></div>

    <!-- Top Branding -->
    <div class="pedal-top-strip">
        <div class="mod-pedal-brand">CYBER AUDIO</div>
        <div class="mod-pedal-model">SWELL-DIFFUSED PAD DELAY</div>
    </div>

    <!-- Pedal Name -->
    <div class="mod-pedal-name">CLOUD BLOOM</div>

    <!-- Knobs Container -->
    <div class="cyber-knobs-grid">
        <!-- Row 1 -->
        <div class="knob-cell">
            <div class="custom-knob-dial" data-symbol="time" data-min="20" data-max="2000" data-default="450">
                <div class="knob-rotor"></div>
            </div>
            <span class="mod-knob-title">TIME</span>
            <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="time" style="display:none;"></div>
        </div>

        <div class="knob-cell">
            <div class="custom-knob-dial" data-symbol="feedback" data-min="0" data-max="100" data-default="65">
                <div class="knob-rotor"></div>
            </div>
            <span class="mod-knob-title">REPEAT</span>
            <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="feedback" style="display:none;"></div>
        </div>

        <div class="knob-cell">
            <div class="custom-knob-dial" data-symbol="bloom" data-min="0" data-max="100" data-default="40">
                <div class="knob-rotor"></div>
            </div>
            <span class="mod-knob-title">BLOOM</span>
            <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="bloom" style="display:none;"></div>
        </div>

        <div class="knob-cell">
            <div class="custom-knob-dial" data-symbol="smear" data-min="0" data-max="100" data-default="75">
                <div class="knob-rotor"></div>
            </div>
            <span class="mod-knob-title">SMEAR</span>
            <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="smear" style="display:none;"></div>
        </div>

        <!-- Row 2 -->
        <div class="knob-cell">
            <div class="custom-knob-dial" data-symbol="warmth" data-min="0" data-max="100" data-default="50">
                <div class="knob-rotor"></div>
            </div>
            <span class="mod-knob-title">WARMTH</span>
            <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="warmth" style="display:none;"></div>
        </div>

        <div class="knob-cell">
            <div class="custom-knob-dial" data-symbol="mod" data-min="0" data-max="100" data-default="35">
                <div class="knob-rotor"></div>
            </div>
            <span class="mod-knob-title">MOD</span>
            <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="mod" style="display:none;"></div>
        </div>

        <div class="knob-cell">
            <div class="custom-knob-dial" data-symbol="shimmer" data-min="0" data-max="100" data-default="30">
                <div class="knob-rotor"></div>
            </div>
            <span class="mod-knob-title">SHIMMER</span>
            <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="shimmer" style="display:none;"></div>
        </div>

        <div class="knob-cell">
            <div class="custom-knob-dial" data-symbol="mix" data-min="0" data-max="100" data-default="50">
                <div class="knob-rotor"></div>
            </div>
            <span class="mod-knob-title">MIX</span>
            <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="mix" style="display:none;"></div>
        </div>
    </div>

    <!-- Bottom Controls & Footswitches -->
    <div class="pedal-bottom-section">
        <!-- Freeze Hold Toggle Button -->
        <div class="freeze-toggle-wrapper">
            <button type="button" class="freeze-btn" data-symbol="hold">
                <span class="freeze-dot"></span> FREEZE
            </button>
            <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="hold" style="display:none;"></div>
        </div>

        <!-- Main Bypass Footswitch -->
        <div class="footswitch-wrapper">
            <div class="mod-led" mod-role="bypass-light"></div>
            <div class="mod-footswitch" mod-role="bypass"></div>
        </div>
    </div>
</div>
